<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Sky & Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="40%" stop-color="#87CEEB" />
      <stop offset="70%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- School Bus Yellow Gradient -->
    <linearGradient id="busYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="75%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="busGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="320" fill="url(#skyGrad)" />

  <!-- Distant Trees & Greenery -->
  <path d="M0 260 Q 80 230 160 255 Q 240 220 320 250 Q 400 210 500 245 Q 620 220 720 250 Q 770 230 800 245 L 800 320 L 0 320 Z" fill="#10B981" opacity="0.6" />
  <path d="M0 270 Q 120 240 240 265 Q 360 235 480 260 Q 600 235 700 255 Q 760 245 800 250 L 800 320 L 0 320 Z" fill="#047857" opacity="0.8" />

  <!-- Campus School Building Architecture in Background -->
  <g fill="url(#buildingGrad)" opacity="0.85">
    <rect x="180" y="110" width="440" height="150" rx="4" />
    <rect x="230" y="80" width="340" height="30" rx="2" fill="#64748B" />
    <!-- Pediment & Clock -->
    <polygon points="400,35 320,80 480,80" fill="#475569" />
    <circle cx="400" cy="65" r="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
    <line x1="400" y1="65" x2="400" y2="58" stroke="#0F172A" stroke-width="1.5" />
    <line x1="400" y1="65" x2="406" y2="65" stroke="#0F172A" stroke-width="1.5" />

    <!-- Building Windows -->
    <g fill="#E2E8F0" stroke="#475569" stroke-width="1.5">
      <rect x="210" y="130" width="35" height="45" rx="3" />
      <rect x="265" y="130" width="35" height="45" rx="3" />
      <rect x="320" y="130" width="35" height="45" rx="3" />
      <rect x="445" y="130" width="35" height="45" rx="3" />
      <rect x="500" y="130" width="35" height="45" rx="3" />
      <rect x="555" y="130" width="35" height="45" rx="3" />

      <rect x="210" y="195" width="35" height="45" rx="3" />
      <rect x="265" y="195" width="35" height="45" rx="3" />
      <rect x="320" y="195" width="35" height="45" rx="3" />
      <rect x="445" y="195" width="35" height="45" rx="3" />
      <rect x="500" y="195" width="35" height="45" rx="3" />
      <rect x="555" y="195" width="35" height="45" rx="3" />
    </g>

    <!-- School Portico Entrance -->
    <rect x="375" y="170" width="50" height="90" fill="#334155" />
    <rect x="365" y="160" width="70" height="10" fill="#1E293B" />
  </g>

  <!-- Campus Green Lawn -->
  <rect x="0" y="260" width="800" height="60" fill="url(#grassGrad)" />

  <!-- Road / Driveway -->
  <rect x="0" y="310" width="800" height="190" fill="url(#roadGrad)" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#FDE047" stroke-width="4" stroke-dasharray="25 20" opacity="0.6" />

  <!-- ==================== SCHOOL BUS ==================== -->
  <g id="schoolBusGroup">
    <!-- Bus Body Shadow -->
    <ellipse cx="400" cy="405" rx="290" ry="18" fill="#020617" opacity="0.55" />

    <!-- Main Bus Chassis -->
    <path d="M 140 240 
             L 580 240 
             Q 640 240 655 270 
             L 665 315 
             Q 675 350 670 375 
             L 655 385 
             L 130 385 
             Q 115 385 115 365 
             L 115 260 
             Q 115 240 140 240 Z" 
          fill="url(#busYellow)" stroke="#B45309" stroke-width="2" />

    <!-- Roof Rounded Cap -->
    <rect x="135" y="232" width="500" height="12" rx="5" fill="#FEF08A" />

    <!-- Black Safety Rub-Rails (Standard on Indian School Buses) -->
    <rect x="120" y="325" width="545" height="6" fill="#1E293B" />
    <rect x="120" y="358" width="535" height="5" fill="#1E293B" />

    <!-- "SCHOOL BUS" Text Banner (Indian Standard Style) -->
    <rect x="260" y="334" width="260" height="22" rx="3" fill="#0F172A" />
    <text x="390" y="350" font-family="'Poppins', sans-serif" font-size="13" font-weight="800" fill="#FACC15" text-anchor="middle" letter-spacing="3">SCHOOL BUS</text>

    <!-- Side Passenger Windows -->
    <g fill="url(#busGlass)" stroke="#334155" stroke-width="2.5">
      <rect x="145" y="252" width="55" height="60" rx="4" />
      <rect x="210" y="252" width="55" height="60" rx="4" />
      <rect x="275" y="252" width="55" height="60" rx="4" />
      <rect x="340" y="252" width="55" height="60" rx="4" />
      <rect x="405" y="252" width="55" height="60" rx="4" />
      <rect x="470" y="252" width="55" height="60" rx="4" />
      <!-- Driver Front Window -->
      <path d="M 535 252 L 600 252 Q 625 252 635 275 L 645 312 L 535 312 Z" rx="4" />
    </g>

    <!-- Window Pillars & Dividers -->
    <g stroke="#EAB308" stroke-width="1.5">
      <line x1="172" y1="252" x2="172" y2="312" />
      <line x1="237" y1="252" x2="237" y2="312" />
      <line x1="302" y1="252" x2="302" y2="312" />
      <line x1="367" y1="252" x2="367" y2="312" />
      <line x1="432" y1="252" x2="432" y2="312" />
      <line x1="497" y1="252" x2="497" y2="312" />
    </g>

    <!-- Wheels & Wheel Arches -->
    <!-- Rear Wheel -->
    <path d="M 195 385 A 38 38 0 0 1 270 385 Z" fill="#1E293B" />
    <circle cx="232" cy="385" r="32" fill="url(#tireGrad)" stroke="#0F172A" stroke-width="3" />
    <circle cx="232" cy="385" r="18" fill="#94A3B8" stroke="#475569" stroke-width="2" />
    <circle cx="232" cy="385" r="6" fill="#0F172A" />

    <!-- Front Wheel -->
    <path d="M 535 385 A 38 38 0 0 1 610 385 Z" fill="#1E293B" />
    <circle cx="572" cy="385" r="32" fill="url(#tireGrad)" stroke="#0F172A" stroke-width="3" />
    <circle cx="572" cy="385" r="18" fill="#94A3B8" stroke="#475569" stroke-width="2" />
    <circle cx="572" cy="385" r="6" fill="#0F172A" />

    <!-- Front Grill & Bumper -->
    <rect x="645" y="335" width="24" height="42" rx="3" fill="#334155" />
    <line x1="648" y1="344" x2="666" y2="344" stroke="#94A3B8" stroke-width="2" />
    <line x1="648" y1="352" x2="666" y2="352" stroke="#94A3B8" stroke-width="2" />
    <line x1="648" y1="360" x2="666" y2="360" stroke="#94A3B8" stroke-width="2" />
    <line x1="648" y1="368" x2="666" y2="368" stroke="#94A3B8" stroke-width="2" />

    <!-- Headlights & Indicators -->
    <circle cx="660" cy="325" r="7" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
    <circle cx="660" cy="325" r="4" fill="#FFFFFF" />
    <rect x="655" y="378" width="16" height="5" rx="2" fill="#F97316" />

    <!-- Rear Tail Lights -->
    <rect x="114" y="335" width="4" height="15" rx="1" fill="#EF4444" />
    <rect x="114" y="352" width="4" height="8" rx="1" fill="#F59E0B" />

    <!-- Rear Bumper & Front Heavy Duty Bumper -->
    <rect x="110" y="380" width="18" height="10" rx="2" fill="#1E293B" />
    <rect x="640" y="378" width="32" height="12" rx="3" fill="#1E293B" />
  </g>

  <!-- Health & Security Top Badge -->
  <g transform="translate(40, 30)">
    <rect width="180" height="38" rx="19" fill="#063B66" opacity="0.9" stroke="#F8C531" stroke-width="2" />
    <!-- Shield Icon -->
    <path d="M22 10 L 32 14 L 32 24 C 32 30, 22 34, 22 34 C 22 34, 12 30, 12 24 L 12 14 Z" fill="#F8C531" />
    <text x="44" y="24" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">SAFE TRANSIT</text>
  </g>

  <g transform="translate(580, 30)">
    <rect width="180" height="38" rx="19" fill="#063B66" opacity="0.9" stroke="#10B981" stroke-width="2" />
    <!-- Medical Cross -->
    <circle cx="22" cy="19" r="10" fill="#10B981" />
    <rect x="20" y="13" width="4" height="12" fill="#FFFFFF" />
    <rect x="16" y="17" width="12" height="4" fill="#FFFFFF" />
    <text x="44" y="24" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">FIRST AID CARE</text>
  </g>
</svg>
