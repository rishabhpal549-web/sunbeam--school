<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063B66" />
      <stop offset="100%" stop-color="#0d4e83" />
    </linearGradient>
  </defs>
  <rect width="300" height="350" fill="url(#pGrad)" />
  
  <!-- Academic Cap & Silhouette -->
  <g transform="translate(150, 140)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="45" fill="#E2E8F0" />
    <!-- Academic Cap -->
    <polygon points="0,-75 55,-60 0,-45 -55,-60" fill="#F8C531" />
    <rect x="-10" y="-55" width="20" height="15" fill="#063B66" />
    <line x1="55" y1="-60" x2="60" y2="-30" stroke="#F8C531" stroke-width="2" />
    <circle cx="60" cy="-28" r="4" fill="#F8C531" />
    <!-- Shoulders -->
    <path d="M-75 80 C-75 30, 75 30, 75 80 Z" fill="#E2E8F0" />
    <polygon points="0,40 -20,80 20,80" fill="#F8C531" />
  </g>
  
  <rect x="25" y="270" width="250" height="50" rx="6" fill="#042744" stroke="#F8C531" stroke-dasharray="4" />
  <text x="150" y="302" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8C531" text-anchor="middle">[ADD OFFICIAL PRINCIPAL PHOTO]</text>
</svg>
